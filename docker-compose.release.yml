name: near-chat

services:
  db:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    # Pinned by digest like `db`, and held to the same value as REDIS_IMAGE in
    # .github/workflows/release-stack.yml — the release re-verifies the bundle
    # against that variable, and backend/tests/unit/deploy holds the two sides
    # equal on every pull request so the pin cannot drift between releases.
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    # Publishes no host port, like the production stack: this Redis has no
    # password, so being reachable only from the compose network *is* its access
    # control. Exec into the container to inspect it.
    #
    # Everything kept here is derived, recoverable state (presence leases,
    # typing TTLs, routing metadata, pub/sub) with PostgreSQL staying canonical,
    # so there is nothing to persist and `docker compose restart redis` is safe.
    # Save points are switched *off* rather than left unused: with them on, one
    # failed background save flips `stop-writes-on-bgsave-error` and Redis
    # rejects every write while still answering PING, which the healthcheck
    # below could not tell apart from a healthy server. Eviction stays at the
    # `noeviction` default so presence leases fail loudly rather than vanish.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      # The image declares VOLUME /data, and the documented upgrade path here is
      # a repeated `up -d`, so without this every upgrade would strand another
      # anonymous volume on the deployment host. With save points off, nothing
      # is ever written there.
      - /data
    healthcheck:
      # `redis-cli ping` can exit 0 while printing an error reply, so assert the
      # payload rather than just the exit status.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: ["bun", "run", "migrate:up"]

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    ports:
      - "4005:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      # Resolved inside this container, so the host is the compose service name
      # `redis` — the one this bundle ships. Point it at a managed endpoint
      # (`rediss://`, or the Valkey schemes) to use that instead; the bundled
      # service then just idles.
      #
      # `-` rather than `:-`, matching docker-compose.yml and
      # docker-compose.prod.yml: running without Redis is a supported deployment
      # (every REST route still works and realtime runs single-node), and an
      # empty REDIS_URL is how you ask for it. `:-` would substitute the default
      # for an empty value too, leaving that opt-out unreachable.
      REDIS_URL: ${REDIS_URL-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      # This bundle publishes the backend port directly, so callers arrive as
      # themselves and the peer address is the right thing to bucket on. Raise
      # this to the number of reverse proxies you put in front — the client IP is
      # then read that many entries from the right of X-Forwarded-For. Leaving it
      # at 0 behind a proxy funnels every caller into one bucket; setting it above
      # the real number of hops lets callers choose their own.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      ATTACHMENT_TYPE_RESTRICTION_ENABLED: ${ATTACHMENT_TYPE_RESTRICTION_ENABLED:-false}
      ATTACHMENT_ALLOWED_MIME_TYPES: ${ATTACHMENT_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/gif,application/pdf,application/zip,text/plain}
      ATTACHMENT_ALLOWED_EXTENSIONS: ${ATTACHMENT_ALLOWED_EXTENSIONS:-.jpg,.jpeg,.png,.gif,.pdf,.zip,.txt}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      MAX_SESSIONS_PER_USER: ${MAX_SESSIONS_PER_USER:-5}
      PRESENCE_GRACE_MS: ${PRESENCE_GRACE_MS:-3000}
      # How long a presence lease survives in Redis unrefreshed; it bounds how
      # long an instance that died without draining keeps its users showing as
      # online. A graceful stop hands the leases back instead, well inside the
      # stop_grace_period below. Inert only when REDIS_URL is blanked.
      PRESENCE_TTL_MS: ${PRESENCE_TTL_MS:-30000}
      TYPING_TTL_MS: ${TYPING_TTL_MS:-3000}
      # Blank means the backend generates one per process. Set it where the
      # orchestrator already has a stable per-replica name, so a restarted
      # process reclaims its own presence lease instead of adding a second one.
      INSTANCE_ID: ${INSTANCE_ID:-}
      # Blank means the unscoped `near-chat-ws` channel, which is right for a
      # bundle that brings its own Redis. Set it, differently per deployment,
      # when several versioned deployments share one managed Redis: pub/sub is
      # not separated by the logical database, so distinct REDIS_URL databases
      # do not keep them apart.
      REALTIME_CLUSTER_ID: ${REALTIME_CLUSTER_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Started, not healthy, matching docker-compose.yml and
      # docker-compose.prod.yml. src/utils/redis.ts treats Redis as a degraded
      # mode rather than a boot dependency, so gating here would let a Redis that
      # cannot start take down every REST route that never touches Redis — after
      # `migrate` has already applied the schema. Ordering is still worth having:
      # starting redis first means the usual case connects on the first attempt
      # instead of waiting out a watchdog tick.
      redis:
        condition: service_started
    volumes:
      - ${UPLOADS_MOUNT_SOURCE:-app_uploads}:/app/uploads
    command: ["bun", "src/index.ts"]
    # Docker's default is 10s, which is under this backend's own worst-case
    # drain: src/index.ts forces the HTTP drain after 10s, then spends up to 2s
    # handing presence leases back and up to 2s closing Redis. At the default a
    # slow drain is SIGKILLed exactly while releasing those leases, leaving users
    # showing online until PRESENCE_TTL_MS expires — the outcome presence.stop()
    # exists to avoid. 30s clears that ~14s worst case and stays above the 20s
    # shutdown deadline src/index.ts arms, so the process always exits itself
    # first (issue #586).
    stop_grace_period: 30s

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4005}
      ALLOWED_DEV_ORIGINS: ${ALLOWED_DEV_ORIGINS:-}
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  app_uploads:
